
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.wrap { padding: 1.25rem 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; }
.header { margin-bottom: 1.25rem; }
.header h2 { font-size: 17px; font-weight: 500; color: #111; margin-bottom: 3px; }
.header p { font-size: 12px; color: #888; }
.controls { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.controls label { font-size: 13px; color: #555; font-weight: 500; white-space: nowrap; }
select { height: 34px; padding: 0 10px; border: 1px solid #ddd; border-radius: 7px; font-size: 13px; background: #fff; color: #111; min-width: 180px; cursor: pointer; outline: none; }
select:focus { border-color: #999; }
.badge { background: #f5f5f5; color: #555; font-size: 12px; padding: 4px 10px; border-radius: 20px; }
.badge b { color: #111; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { border-bottom: 2px solid #ebebeb; }
thead th { text-align: left; padding: 7px 10px; font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.05em; }
th.r, td.r { text-align: right; }
tbody tr { border-bottom: 0.5px solid #f2f2f2; }
tbody tr:hover { background: #fafafa; }
tbody td { padding: 8px 10px; color: #111; vertical-align: middle; }
td.num { color: #bbb; font-size: 11px; width: 24px; text-align: right; }
td.ean { font-family: 'SF Mono', 'Fira Mono', monospace; font-size: 11.5px; color: #666; white-space: nowrap; }
td.prod { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.uds { font-weight: 500; font-variant-numeric: tabular-nums; }
td.c-hi { color: #1a7a32; }
td.c-md { color: #b36200; }
td.c-lo { color: #333; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.table-wrap { border: 1px solid #ebebeb; border-radius: 9px; overflow: hidden; }
.loader { text-align: center; padding: 3rem; color: #aaa; font-size: 13px; }
.error-box { padding: 1rem 1.25rem; background: #fff8f8; border: 1px solid #fdd; border-radius: 8px; color: #c0392b; font-size: 13px; line-height: 1.6; }
.error-box b { display: block; margin-bottom: 4px; }
.footer { margin-top: 8px; font-size: 11px; color: #ccc; text-align: right; }
</style>

<div class="wrap">
  <div class="header">
    <h2>Surtido por tienda</h2>
    <p>Unidades a surtir · primeras 20 líneas · fuente: Aleph → Google Sheets</p>
  </div>
  <div class="controls">
    <label for="sel">Tienda</label>
    <select id="sel" disabled><option>Cargando…</option></select>
    <div class="badge" id="badge" style="display:none"><b id="cnt">0</b> productos</div>
  </div>
  <div id="content"><div class="loader">Conectando con Google Sheets…</div></div>
  <div class="footer" id="ts"></div>
</div>

<script>
const SHEET_ID = '1gV2mNRXIh15Wmc-R_dUyp3aybezsuyqoxwKKFodykYQ';
const GID      = '1604720670';
const API_KEY  = 'AIzaSyBjTToR0Dwlw3Z6qIlCV5lG9FV4Lf8eWmU';

let allRows = [];

function colLetter(n) {
  let s = '';
  while (n > 0) { s = String.fromCharCode(65 + (n-1)%26) + s; n = Math.floor((n-1)/26); }
  return s;
}

async function loadSheet() {
  const range = encodeURIComponent('Productos!B13:Z3000');
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}&majorDimension=ROWS`;
  const r = await fetch(url);
  if (!r.ok) {
    const txt = await r.text();
    let msg = `HTTP ${r.status}`;
    try { const j = JSON.parse(txt); msg = j.error?.message || msg; } catch(e){}
    throw new Error(msg);
  }
  const j = await r.json();
  return j.values || [];
}

function findCol(headers, keywords) {
  const h = headers.map(x => (x||'').toUpperCase().replace(/\s+/g,'_'));
  for (const kw of keywords) {
    const i = h.findIndex(x => x.includes(kw));
    if (i !== -1) return i;
  }
  return -1;
}

function renderTable(tienda) {
  const rows = allRows.filter(r => r.tienda === tienda).slice(0, 20);
  document.getElementById('badge').style.display = 'inline-block';
  document.getElementById('cnt').textContent = rows.length;
  if (!rows.length) {
    document.getElementById('content').innerHTML = '<div style="text-align:center;padding:2rem;color:#aaa;font-size:13px">Sin productos para esta tienda.</div>';
    return;
  }
  const mx = Math.max(...rows.map(r => r.uds), 1);
  const trs = rows.map((r, i) => {
    const ratio = r.uds / mx;
    const cls = ratio >= 0.6 ? 'c-hi' : ratio >= 0.25 ? 'c-md' : 'c-lo';
    const prod = r.producto.length > 52 ? r.producto.slice(0, 52) + '…' : r.producto;
    return `<tr>
      <td class="num">${i+1}</td>
      <td class="ean">${r.ean}</td>
      <td class="prod" title="${r.producto.replace(/"/g,'&quot;')}">${prod}</td>
      <td class="uds r ${cls}">${r.uds.toLocaleString('es-CO')}</td>
    </tr>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:24px"></th>
          <th>EAN</th>
          <th>Producto</th>
          <th class="r">Uds. surtir</th>
        </tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>`;
}

(async () => {
  try {
    const raw = await loadSheet();
    if (!raw.length) throw new Error('La hoja está vacía o el rango B13:Z no devolvió datos.');

    const headers = raw[0];
    const iTienda = findCol(headers, ['TIENDA','STORE']);
    const iEAN    = findCol(headers, ['EAN']);
    const iProd   = findCol(headers, ['PRODUCTO','PRODUCT','NOMBRE']);
    const iUds    = findCol(headers, ['SURTIR','UNIDADES_A','UNITS']);

    if ([iTienda, iEAN, iProd, iUds].some(x => x === -1)) {
      throw new Error(`No se encontraron todas las columnas necesarias.<br>
        Headers detectados en B13: <b>${headers.join(', ')}</b><br>
        Busco: TIENDA, EAN, PRODUCTO, SURTIR`);
    }

    allRows = raw.slice(1)
      .filter(r => r[iTienda] && r[iTienda].trim())
      .map(r => ({
        tienda:   (r[iTienda] || '').trim(),
        ean:      (r[iEAN]    || '').trim(),
        producto: (r[iProd]   || '').trim(),
        uds:      parseInt((r[iUds]||'0').replace(/[^0-9-]/g,''), 10) || 0
      }));

    const tiendas = [...new Set(allRows.map(r => r.tienda))].sort((a,b) => a.localeCompare(b,'es'));
    const sel = document.getElementById('sel');
    sel.innerHTML = tiendas.map(t => `<option value="${t}">${t}</option>`).join('');
    sel.disabled = false;
    sel.addEventListener('change', () => renderTable(sel.value));
    renderTable(tiendas[0]);
    document.getElementById('ts').textContent =
      'Cargado: ' + new Date().toLocaleString('es-CO', {dateStyle:'short', timeStyle:'short'});
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="error-box"><b>Error al cargar datos</b>${e.message}</div>`;
    document.getElementById('sel').disabled = true;
  }
})();
</script>
