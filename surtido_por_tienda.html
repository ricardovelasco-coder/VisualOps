
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; }
.wrap { padding: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; }
.header { margin-bottom: 1.25rem; }
.header h2 { font-size: 18px; font-weight: 500; color: #1a1a1a; margin-bottom: 4px; }
.header p { font-size: 13px; color: #666; }
.controls { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.controls label { font-size: 13px; color: #555; font-weight: 500; white-space: nowrap; }
select { height: 36px; padding: 0 12px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; background: #fff; color: #1a1a1a; min-width: 200px; cursor: pointer; outline: none; }
select:focus { border-color: #888; }
.badge { background: #f0f0f0; color: #444; font-size: 12px; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
.badge span { font-weight: 500; color: #1a1a1a; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { border-bottom: 1.5px solid #e0e0e0; }
thead th { text-align: left; padding: 8px 10px; font-weight: 500; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.04em; }
thead th.right { text-align: right; }
tbody tr { border-bottom: 0.5px solid #f0f0f0; transition: background 0.1s; }
tbody tr:hover { background: #fafafa; }
tbody td { padding: 9px 10px; color: #1a1a1a; }
tbody td.ean { font-family: monospace; font-size: 12px; color: #555; white-space: nowrap; }
tbody td.producto { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody td.unidades { text-align: right; font-weight: 500; }
tbody td.unidades.high { color: #2d7a3a; }
tbody td.unidades.mid { color: #b36200; }
tbody td.unidades.low { color: #1a1a1a; }
.row-num { color: #bbb; font-size: 11px; width: 28px; text-align: right; padding-right: 6px; }
.loader { text-align: center; padding: 3rem; color: #888; font-size: 14px; }
.error { text-align: center; padding: 2rem; color: #c0392b; font-size: 13px; background: #fff5f5; border-radius: 8px; border: 0.5px solid #fcc; }
.empty { text-align: center; padding: 2rem; color: #999; font-size: 13px; }
.table-wrap { border: 0.5px solid #e8e8e8; border-radius: 10px; overflow: hidden; }
.footer { margin-top: 10px; font-size: 11px; color: #bbb; text-align: right; }
</style>

<div class="wrap">
  <div class="header">
    <h2>Surtido por tienda</h2>
    <p>Unidades a surtir — primeras 20 líneas por tienda</p>
  </div>

  <div class="controls">
    <label for="storeSelect">Tienda</label>
    <select id="storeSelect" disabled><option>Cargando...</option></select>
    <div class="badge" id="countBadge" style="display:none">Mostrando <span id="countVal">0</span> productos</div>
  </div>

  <div id="content"><div class="loader">Cargando datos desde Google Sheets…</div></div>
  <div class="footer" id="lastUpdate"></div>
</div>

<script>
const SHEET_ID = '1gV2mNRXIh15Wmc-R_dUyp3aybezsuyqoxwKKFodykYQ';
const API_KEY  = 'AIzaSyBjTToR0Dwlw3Z6qIlCV5lG9FV4Lf8eWmU';
const SHEET_NAME = 'Productos';

let allData = [];

async function loadData() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(SHEET_NAME)}?key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  const json = await res.json();
  const rows = json.values || [];
  if (rows.length < 2) throw new Error('Sin datos en la hoja');

  const headers = rows[0].map(h => h.trim().toUpperCase().replace(/\s+/g,'_'));
  const idxTienda   = headers.findIndex(h => h.includes('TIENDA'));
  const idxEAN      = headers.findIndex(h => h.includes('EAN'));
  const idxProd     = headers.findIndex(h => h.includes('PRODUCTO'));
  const idxUnidades = headers.findIndex(h => h.includes('SURTIR'));

  if ([idxTienda, idxEAN, idxProd, idxUnidades].some(i => i === -1)) {
    throw new Error(`Columnas no encontradas. Headers: ${headers.join(', ')}`);
  }

  return rows.slice(1)
    .filter(r => r[idxTienda])
    .map(r => ({
      tienda:   (r[idxTienda]   || '').trim(),
      ean:      (r[idxEAN]      || '').trim(),
      producto: (r[idxProd]     || '').trim(),
      unidades: parseInt(r[idxUnidades] || '0', 10) || 0
    }));
}

function getStores(data) {
  return [...new Set(data.map(d => d.tienda))].sort((a, b) => a.localeCompare(b, 'es'));
}

function renderTable(tienda) {
  const rows = allData.filter(d => d.tienda === tienda).slice(0, 20);
  const badge = document.getElementById('countBadge');
  const countVal = document.getElementById('countVal');
  badge.style.display = 'flex';
  countVal.textContent = rows.length;

  if (!rows.length) {
    document.getElementById('content').innerHTML = '<div class="empty">Sin datos para esta tienda.</div>';
    return;
  }

  const maxU = Math.max(...rows.map(r => r.unidades));
  const trs = rows.map((r, i) => {
    const ratio = maxU > 0 ? r.unidades / maxU : 0;
    const cls = ratio >= 0.6 ? 'high' : ratio >= 0.3 ? 'mid' : 'low';
    const prodShort = r.producto.length > 55 ? r.producto.slice(0, 55) + '…' : r.producto;
    return `<tr>
      <td class="row-num">${i+1}</td>
      <td class="ean">${r.ean}</td>
      <td class="producto" title="${r.producto.replace(/"/g,'&quot;')}">${prodShort}</td>
      <td class="unidades ${cls}">${r.unidades}</td>
    </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:28px"></th>
            <th>EAN</th>
            <th>Producto</th>
            <th class="right">Uds. a surtir</th>
          </tr>
        </thead>
        <tbody>${trs}</tbody>
      </table>
    </div>`;
}

(async () => {
  try {
    allData = await loadData();
    const stores = getStores(allData);
    const sel = document.getElementById('storeSelect');
    sel.innerHTML = stores.map(s => `<option value="${s}">${s}</option>`).join('');
    sel.disabled = false;
    sel.addEventListener('change', () => renderTable(sel.value));
    renderTable(stores[0]);
    document.getElementById('lastUpdate').textContent =
      `Actualizado: ${new Date().toLocaleString('es-CO', {dateStyle:'short', timeStyle:'short'})}`;
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="error"><strong>Error al cargar datos</strong><br>${e.message}</div>`;
    document.getElementById('storeSelect').disabled = true;
  }
})();
</script>
